version: '3.8'

services:

  nginx:
    image: nginx:latest
    working_dir: /var/www
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PHP_IDE_CONFIG: "serverName=PHPSTORM"
      TZ: Europe/Moscow
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/cert:/etc/nginx/cert
      - ./docker/nginx/log:/var/log/nginx/
      - socket-admin:/socket
    ports:
      - "8880:80"
      - "4443:443"
    depends_on:
      - php
  php:
    extra_hosts:
      - host.docker.internal:host-gateway

    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        DEV_USER: ${DEV_USER:-1891243316}
    environment:
      DISABLE_DEFAULT_SERVER: 1
      PHP_IDE_CONFIG: "serverName=PHPSTORM"
      TZ: Europe/Moscow
    working_dir: /var/www
    command: php-fpm -R # Allow running FPM as root
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
      - ./docker/php/php-fpm.d/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - socket-admin:/socket
    ports:
      - 5173:5173
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gallery
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10

volumes:
  socket-admin:
  db_data:




